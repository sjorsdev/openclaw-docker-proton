services:
  openclaw:
    build: .
    container_name: openclaw
    restart: unless-stopped
    env_file: .env
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - BOT_NAME=${BOT_NAME:-OpenClaw}
    volumes:
      # Named volume for state + credential persistence.
      # pass-cli session, rclone config, and encryption key live here.
      # State also syncs to Proton Drive.
      - openclaw-state:/home/node/.openclaw
    ports:
      # Loopback only — access via SSH tunnel or Tailscale for remote.
      # Remove 127.0.0.1: to expose publicly (secure with gateway token).
      - "127.0.0.1:18789:18789"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "-w", "", "http://localhost:18789/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Graceful shutdown: let the final sync complete
    stop_grace_period: 30s

volumes:
  openclaw-state:
